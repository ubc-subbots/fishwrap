services:
  olivetin:
    container_name: olivetin
    image: jamesread/olivetin
    volumes:
      - ./olivetin/config:/config
      - ./olivetin/keys:/home/olivetin/.ssh
    ports:
      - "80:1337"
    restart: unless-stopped

  lichtblick:
    container_name: lichtblick
    image: ghcr.io/lichtblick-suite/lichtblick:latest
    ports:
      - "81:8080"
    restart: unless-stopped

  webssh:
    build: webssh
    ports:
      - "82:8888"
    restart: unless-stopped
