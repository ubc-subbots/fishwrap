listenAddressSingleHTTPFrontend: 0.0.0.0:1337
logLevel: "INFO"
insecureAllowDumpSos: true

actions:
  - title: Reboot Robot
    shell: ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'sudo reboot'
    icon: restart
    popupOnStart: default
    arguments:
      - type: confirmation
        title: Confirm?
  
  - title: Shutdown Robot
    shell: ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'sudo shutdown 0'
    icon: "&#128680;"
    popupOnStart: default
    arguments:
      - type: confirmation
        title: Confirm?

  - title: Kill and Delete ROS Container
    shell: ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'docker rm -f steelhead-sbc'
    icon: "&#9940;"
    popupOnStart: execution-dialog
    arguments:
      - type: confirmation
        title: Confirm?

  - title: List Docker Containers
    shell: ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'docker ps -a'
    icon: "&#128230;"
    popupOnStart: execution-dialog

  - title: List Docker Images
    shell: ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'docker image ls'
    icon: "&#128230;"
    popupOnStart: execution-dialog

  - title: Download latest ROS Container
    shell: ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'docker pull ghcr.io/ubc-subbots/steelhead-sbc:latest'
    icon: "&#128259;"
    timeout: 1200
    popupOnStart: execution-dialog

  - title: Start Steelhead ROS Container
    shell: |
      #!/bin/bash
      ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 '
        if [ -n "$(sudo docker ps --filter 'name=^steelhead-sbc$' --filter 'status=running' --quiet)" ]; then
          echo "Container already running."
          exit 0
        fi
        sudo docker run -d \
          --name steelhead-sbc \
          --net=host \
          -v /dev:/dev \
          --privileged \
          ghcr.io/ubc-subbots/steelhead-sbc \
          tail -f /dev/null
      '
    icon: "&#128640;"
    timeout: 60
    popupOnStart: execution-dialog

  - title: Start Rosbridge WebSocket in Steelhead container
    shell: |
      ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'sudo docker exec -d steelhead-sbc bash -lc "
        source /root/steelhead/install/setup.bash &&
        ros2 launch rosbridge_server rosbridge_websocket_launch.xml
      "'
    icon: "&#128268;"
    timeout: 15
    popupOnStart: execution-dialog


  - title: Steelhead Container Initialize Listeners and Topics
    shell: |
        ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'sudo docker exec -d steelhead-sbc bash -lc "
          source /root/steelhead/install/setup.bash &&
          ros2 launch steelhead_bringup pool_test_base_launch.py
        "'
    icon: "&#128161;"
    timeout: 40
    popupOnStart: execution-dialog

  - title: Configure on-boot launch file
    icon: "&#128736;"
    shell: |
        ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'sed -Ei "
          /ros2/c\  ros2 launch {{ PACKAGE }} {{ LAUNCHFILE }}" 
          /home/subbots/fishwrap/olivetin/autostart.sh'
    type: ascii_identifier
    arguments:
      - name: PACKAGE
        title: Package name
        suggestions:
          - steelhead_bringup:
      - name: LAUNCHFILE
        title: Launchfile name
        suggestions:
          - pool_test_hardcode_launch.py:

  - title: Enable/Disable on-boot routine auto launch
    shell: |
        ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'sudo systemctl {{ newStatus }} steelhead-autolaunch.service --no-pager
        '
    icon: "&#128295;"
    timeout: 10
    arguments:
      - name: newStatus
        description: What to do to on-boot routine?
        choices:
          - title: Enable
            value: enable

          - title: Disable
            value: disable

          - title: Query Status
            value: status
    popupOnStart: execution-dialog

  - title: Run on-boot auto launch NOW
    shell: |
        ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 '/home/subbots/fishwrap/olivetin/autostart.sh
        '
    icon: "&#129349;"
    timeout: 30
    popupOnStart: execution-dialog
  
  - title: Steelhead Container One-click Launch
    shell: |
        ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'sudo docker exec -d steelhead-sbc bash -lc "
          source /root/steelhead/install/setup.bash &&
          ros2 launch steelhead_bringup pool_test_hardcode_launch.py
        "'
    icon: "&#9989;"
    timeout: 40
    popupOnStart: execution-dialog

  - title: Steelhead Container All-thruster Test
    shell: |
        ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'sudo docker exec -d steelhead-sbc bash -lc "
          source /root/steelhead/install/setup.bash &&
          ros2 topic pub /motor_control std_msgs/msg/UInt32 \"data: 0b00100011000110001100011000110001\"
        "'
    icon: "&#127946;"
    timeout: 40
    popupOnStart: execution-dialog

  - title: Steelhead Container All-thruster stop
    shell: |
        ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'sudo docker exec -d steelhead-sbc bash -lc "
          source /root/steelhead/install/setup.bash &&
          ros2 topic pub /motor_control std_msgs/msg/UInt32 \"data: 0b00100001000010000100001000010000\"
        "'
    icon: "&#128721;"
    timeout: 40
    popupOnStart: execution-dialog
  
  - title: Ping Internet
    shell: ping -c 4 1.0.0.1
    timeout: 15
    icon: ping
    popupOnStart: execution-dialog-stdout-only
  
  - title: Ping Router
    shell: ping -c 4 10.42.0.2
    timeout: 15
    icon: ping
    popupOnStart: execution-dialog-stdout-only

  - title: Get Container Network Config
    shell: ssh -o StrictHostKeyChecking=no subbots@172.17.0.1 'ip a'
    icon: "&#128732;"
    popupOnStart: execution-dialog-stdout-only
  
